name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up old images from GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete all untagged images from GHCR (keeps only tagged versions)
          gh api graphql -f query='
            query {
              repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") {
                registryPackages(first: 100) {
                  edges {
                    node {
                      id
                      name
                      packageType
                      versions(first: 100) {
                        edges {
                          node {
                            id
                            version
                            preRelease
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          ' | jq '.data.repository.registryPackages.edges[].node | select(.packageType == "DOCKER") | .versions.edges[].node | select(.preRelease == false) | select(.version | test("^sha-")) | .id' | while read id; do
            echo "Deleting image version: $id"
            gh api graphql -f query="mutation { deletePackageVersion(input: {packageVersionId: \"$id\"}) { success } }"
          done || echo "No untagged images to delete or cleanup completed"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          script: |
            cd ~/devops || mkdir -p ~/devops && cd ~/devops
            
            # Pull latest image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            
            # Stop and remove old container
            docker stop devops-app || true
            docker rm devops-app || true
            
            # Remove dangling and unused images (cleanup old versions)
            docker image prune -f --filter "dangling=true"
            
            # Remove images not used by any container (keep only latest)
            docker image prune -a -f --filter "until=24h"
            
            # Start new container
            docker run -d \
              --name devops-app \
              -p 80:5000 \
              --restart unless-stopped \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest